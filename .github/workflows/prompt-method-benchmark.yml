name: Prompt Method Benchmark

on:
  pull_request:
    branches: [main]
    paths:
      - benchmark/run_public_benchmark.py
      - .github/workflows/prompt-method-benchmark.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install and start Ollama
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://ollama.com/install.sh | sh
          nohup ollama serve >/tmp/ollama.log 2>&1 &
          for i in $(seq 1 90); do
            if curl -sf http://127.0.0.1:11434/api/tags >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/ollama.log || true
          exit 1

      - name: Pull frozen models
        run: |
          ollama pull smollm2:135m-instruct-q3_K_M
          ollama pull qwen2.5:0.5b-instruct-q4_K_M

      - name: Fetch public holdout benchmark
        run: git clone --depth 1 https://github.com/suzgunmirac/BIG-Bench-Hard.git /tmp/BIG-Bench-Hard

      - name: Run benchmark
        shell: bash
        env:
          BBH_DIR: /tmp/BIG-Bench-Hard/bbh
          OUT_DIR: benchmark_results
          MODELS: smollm2:135m-instruct-q3_K_M,qwen2.5:0.5b-instruct-q4_K_M
        run: |
          set -o pipefail
          mkdir -p benchmark_results
          python3 benchmark/run_public_benchmark.py 2>&1 | tee benchmark_results/run.log

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prompt-method-benchmark-results
          path: benchmark_results/
          if-no-files-found: warn
          retention-days: 7

      - name: Show Ollama diagnostics
        if: always()
        run: tail -200 /tmp/ollama.log || true
