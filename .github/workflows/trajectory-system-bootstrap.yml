name: Materialize trajectory-system skills

on:
  push:
    branches:
      - agent/trajectory-system-bootstrap

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch exact public skill source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/jeffrey-skills
          git clone --filter=blob:none --no-checkout https://github.com/Dicklesworthstone/agent_flywheel_clawdbot_skills_and_integrations.git /tmp/jeffrey-skills
          git -C /tmp/jeffrey-skills fetch --depth 1 origin 6bdac0a0c18c86b8d2545d5bf50baf4d44027467
          git -C /tmp/jeffrey-skills checkout --detach 6bdac0a0c18c86b8d2545d5bf50baf4d44027467

      - name: Materialize and verify 27 skills
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib, json, shutil
          root = Path('experiments/trajectory-system')
          upstream = Path('/tmp/jeffrey-skills')
          provenance = json.loads((root / 'skills/provenance.json').read_text())
          for item in provenance['skills']:
              source = upstream / 'skills' / item['skill'] / 'SKILL.md'
              target = root / item['path']
              if not source.is_file():
                  raise SystemExit(f'missing upstream source: {source}')
              data = source.read_bytes()
              digest = hashlib.sha256(data).hexdigest()
              if digest != item['sha256']:
                  raise SystemExit(f"hash mismatch {item['skill']}: {digest} != {item['sha256']}")
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(data)
          shutil.copy2(upstream / 'LICENSE', root / 'skills/upstream/LICENSE')
          PY
          python -m pip install --disable-pip-version-check -q jsonschema
          python experiments/trajectory-system/tests/verify_repository.py

      - name: Commit materialized source
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/trajectory-system-bootstrap.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Materialize trajectory system skill sources'
          git push origin HEAD:agent/trajectory-system-bootstrap
