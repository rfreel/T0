name: Acceptance Harness

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependency
        run: python -m pip install pytest

      - name: Compile harness
        run: python -m py_compile harness/run.py

      - name: Run acceptance harness
        run: >-
          python harness/run.py
          --manifest harness/manifest.json
          --results-dir harness/results

      - name: Upload harness evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-harness-${{ github.sha }}
          path: harness/results
          if-no-files-found: warn
          retention-days: 14
