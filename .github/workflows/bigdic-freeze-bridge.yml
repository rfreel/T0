name: bigdic-freeze-bridge
on:
  push:
    branches: [tool-acquire-20260916]
    paths: ['.github/workflows/bigdic-freeze-bridge.yml']
permissions:
  contents: read
jobs:
  freeze:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact BigDic treatment
        uses: actions/checkout@v4
        with:
          repository: rfreel/bigdic
          ref: 845e308cb69d64e38e7521d39ad639ab3003e0a0
          path: bigdic
          fetch-depth: 1
      - name: Verify treatment identity and pack
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C bigdic rev-parse HEAD)" = "845e308cb69d64e38e7521d39ad639ab3003e0a0"
          test "$(git -C bigdic hash-object data/dictionary-v2.md)" = "a31addfd05999f4d8f6beb67fa8846e3f88329ae"
          printf 'repo=rfreel/bigdic\ncommit=%s\nbranch=operator-compiler-v1\ndictionary_blob=%s\n' \
            "$(git -C bigdic rev-parse HEAD)" "$(git -C bigdic hash-object data/dictionary-v2.md)" > bigdic/FREEZE_RECEIPT.txt
          sha256sum bigdic/data/dictionary-v2.md bigdic/data/contracts_seed.json bigdic/data/dictionary_provenance.json > bigdic/FREEZE_SHA256SUMS
          tar -C bigdic -czf bigdic-845e308.tar.gz --exclude=.git .
      - uses: actions/upload-artifact@v4
        with:
          name: bigdic-845e308-frozen
          path: bigdic-845e308.tar.gz
          retention-days: 1
          compression-level: 0
