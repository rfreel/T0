name: Rust toolchain relay

on:
  push:
    branches:
      - tmp/rust-relay-20260901

permissions:
  contents: read

jobs:
  pack-rust:
    runs-on: ubuntu-24.04
    steps:
      - name: Inspect preinstalled Rust
        shell: bash
        run: |
          set -euxo pipefail
          uname -a
          rustc --version --verbose
          rustc --print sysroot

      - name: Pack minimal rustc toolchain
        shell: bash
        run: |
          set -euxo pipefail
          SYSROOT="$(rustc --print sysroot)"
          HOST="$(rustc -vV | sed -n 's/^host: //p')"
          mkdir -p rust-min/bin rust-min/lib/rustlib/$HOST
          cp "$SYSROOT/bin/rustc" rust-min/bin/
          cp -a "$SYSROOT/lib/"librustc_driver-* rust-min/lib/
          cp -a "$SYSROOT/lib/rustlib/$HOST/lib" rust-min/lib/rustlib/$HOST/
          if [ -d "$SYSROOT/lib/rustlib/$HOST/bin" ]; then cp -a "$SYSROOT/lib/rustlib/$HOST/bin" rust-min/lib/rustlib/$HOST/; fi
          tar -cf - rust-min | zstd -T0 -1 -o rust-min-x86_64-linux.tar.zst
          sha256sum rust-min-x86_64-linux.tar.zst | tee rust-min-x86_64-linux.tar.zst.sha256
          du -sh rust-min rust-min-x86_64-linux.tar.zst

      - name: Upload minimal Rust toolchain
        uses: actions/upload-artifact@v4
        with:
          name: rust-min-x86_64-linux-zst
          path: |
            rust-min-x86_64-linux.tar.zst
            rust-min-x86_64-linux.tar.zst.sha256
          compression-level: 0
          retention-days: 1
