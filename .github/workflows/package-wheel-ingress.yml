name: package-wheel-ingress

on:
  push:
    branches:
      - agent/package-wheel-ingress-20260820
    paths:
      - .github/workflows/package-wheel-ingress.yml
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/package-wheel-ingress.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acquire:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: hypothesis
            spec: hypothesis==6.165.10
          - name: egglog
            spec: egglog==13.2.0
          - name: z3
            spec: z3-solver==5.1.0.0
          - name: duckdb
            spec: duckdb
          - name: ortools
            spec: ortools
          - name: pysat
            spec: python-sat
          - name: angr
            spec: angr==9.3.3
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Prepare
        run: |
          python -m pip install --upgrade pip wheel setuptools
          mkdir -p wheelhouse raw bundle
          python --version | tee bundle/PYTHON.txt
          uname -a | tee bundle/PLATFORM.txt
          printf '%s\n' '${{ matrix.spec }}' > bundle/REQUESTED_SPEC.txt
      - name: Build or resolve wheel closure
        id: wheel
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python -m pip wheel --prefer-binary --wheel-dir wheelhouse '${{ matrix.spec }}' 2>&1 | tee bundle/WHEEL_BUILD.log
      - name: Raw fallback if wheel closure fails
        if: steps.wheel.outcome != 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python -m pip download --dest raw '${{ matrix.spec }}' 2>&1 | tee bundle/RAW_DOWNLOAD.log
      - name: Package manifest
        if: always()
        shell: bash
        run: |
          cp -a wheelhouse/. bundle/ 2>/dev/null || true
          if [ -d raw ]; then mkdir -p bundle/raw && cp -a raw/. bundle/raw/ 2>/dev/null || true; fi
          echo 'wheel_step=${{ steps.wheel.outcome }}' > bundle/STATUS.txt
          find bundle -maxdepth 2 -type f -printf '%P\n' | sort > bundle/FILES.txt
          python - <<'PY'
          from pathlib import Path
          import hashlib, json
          root=Path('bundle')
          rows=[]
          for p in sorted(root.rglob('*')):
              if p.is_file():
                  h=hashlib.sha256(p.read_bytes()).hexdigest()
                  rows.append({'file':str(p.relative_to(root)),'size':p.stat().st_size,'sha256':h})
          (root/'MANIFEST.json').write_text(json.dumps(rows,indent=2))
          PY
      - name: Upload portable package bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.name }}-py313-linux-x64
          path: bundle
          if-no-files-found: error
          retention-days: 7
